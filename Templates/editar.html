<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Livro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main class="form-container">
    <h1>Editar Livro</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="mensagem {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('editar', id=livro[0]) }}" method="post">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" name="titulo" value="{{ livro[1] }}" required>

        <label for="autor">Autor</label>
        <input type="text" id="autor" name="autor" value="{{ livro[2] }}" required>

        <label for="ano_publicado">Ano de publicação</label>
        <input type="number" id="ano_publicado" name="ano_publicado" value="{{ livro[3] }}" min="0" required>

        <div class="botoes">
            <a href="{{ url_for('home') }}" class="btn-voltar">Cancelar</a>
            <button type="submit" class="btn-salvar">Salvar Alterações</button>
        </div>
    </form>
</main>
</body>
</html>
