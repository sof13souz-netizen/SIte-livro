<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Livro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main class="form-container">
    <h1>Adicionar Livro</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="mensagem {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('criar') }}" method="post" enctype="multipart/form-data">

        <label for="imagem">Capa do livro:</label>
        <input type="file" name="imagem" id="imagem" accept=".jpg">

        <label for="titulo">Título</label>
        <input type="text" name="titulo" id="titulo" placeholder="Digite o título do livro" required>

        <label for="autor">Autor</label>
        <input type="text" name="autor" id="autor" placeholder="Digite o nome do autor" required>

        <label for="ano_publicado">Ano de publicação</label>
        <input type="number" name="ano_publicado" id="ano_publicado" placeholder="Ex.: 1899" min="0" required>

        <div class="botoes">
            <a href="{{ url_for('home') }}" class="btn-voltar">Voltar</a>
            <button type="submit" class="btn-salvar">Salvar Livro</button>
        </div>
    </form>
</main>
</body>
</html>
