<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Exclusão</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main class="form-container confirmar">
    <h1>Confirmar Exclusão</h1>
    <p>Tem certeza que deseja excluir o livro <strong>{{ livro[1] }}</strong>?</p>

    <form method="post" action="{{ url_for('deletar', id=livro[0]) }}">
        <div class="botoes">
            <a href="{{ url_for('home') }}" class="btn-voltar">Cancelar</a>
            <button type="submit" class="btn-danger">Sim, excluir</button>
        </div>
    </form>
</main>
</body>
</html>
